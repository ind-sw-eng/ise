{% unless page.url == "/" %}
<nav class="bg-gray-50 py-3 border-b border-gray-200" aria-label="Breadcrumb">
  <div class="mx-auto w-full max-w-screen-xl px-6 lg:px-12">
    <ol class="flex items-center space-x-2 text-sm">
      <li>
        <a href="{{ site.baseurl }}/" class="text-gray-500 hover:text-gray-700 transition-colors">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>
          <span class="sr-only">Home</span>
        </a>
      </li>

      {% if page.collection == "projects" %}
        <li aria-hidden="true">
          <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
        </li>
        <li>
          <a href="{{ site.baseurl }}/projects" class="text-gray-500 hover:text-gray-700 transition-colors">Projects</a>
        </li>
      {% endif %}

      <li aria-hidden="true">
        <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
        </svg>
      </li>
      <li>
        <span class="text-gray-700 font-medium" aria-current="page">{{ page.title }}</span>
      </li>
    </ol>
  </div>
</nav>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ "/" | absolute_url }}"
    }{% if page.collection == "projects" %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Projects",
      "item": "{{ "/projects" | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title | escape }}",
      "item": "{{ page.url | absolute_url }}"
    }{% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title | escape }}",
      "item": "{{ page.url | absolute_url }}"
    }{% endif %}
  ]
}
</script>
{% endunless %}
