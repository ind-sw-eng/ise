---
layout: default
title: 404 - Page Not Found
---

<script>
  // Pages are served without a trailing slash (/sponsor, not /sponsor/).
  // Send /sponsor/ and similar to the working URL instead of showing a 404.
  (function () {
    var base = "{{ site.baseurl }}/";
    var path = window.location.pathname;
    if (path.length > 1 && path.charAt(path.length - 1) === "/") {
      var target = path.replace(/\/+$/, "");
      // Only redirect within the site, so "//other-host/" can never leave it.
      if (target.indexOf(base) === 0 && target.charAt(base.length) !== "/" && target.length > base.length) {
        window.location.replace(target + window.location.search + window.location.hash);
      }
    }
  })();
</script>

<section class="py-12">
  <div class="bg-white border border-gray-300 p-8 text-center max-w-3xl mx-auto">
    <header class="mb-6">
      <h1 class="font-display text-5xl font-bold text-itu-purple">
        404 - Page Not Found
      </h1>
    </header>
    <p class="text-lg text-itu-ink mb-8">
      Oops! The page you are looking for does not exist.
    </p>
    <a
      href="{{ site.baseurl }}/"
      class="bg-itu-teal text-white font-semibold py-3 px-6 hover:bg-itu-teal-dark transition-colors"
      >Go Back Home</a
    >
  </div>
</section>
